services:
  sitemap:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      CACHE_DIR: /app/data
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_MAX_AGE_SECONDS: ${CACHE_MAX_AGE_SECONDS:-86400}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-15}
      UPSTREAM_RETRY_SECONDS: ${UPSTREAM_RETRY_SECONDS:-60}
    expose:
      - "3000"
    volumes:
      - sitemap-cache:/app/data
    stop_grace_period: 25s

volumes:
  sitemap-cache:
